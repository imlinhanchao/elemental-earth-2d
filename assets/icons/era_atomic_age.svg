<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="nuke_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Atomic core glow -->
  <circle cx="32" cy="32" r="28" fill="url(#nuke_glow)" opacity="0.35"/>
  <!-- Nucleus -->
  <circle cx="32" cy="32" r="7" fill="#F43F5E" stroke="#FECDD3" stroke-width="2"/>
  <!-- Intersecting electron orbits -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#A78BFA" stroke-width="2" transform="rotate(-30 32 32)"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#38BDF8" stroke-width="2" transform="rotate(30 32 32)"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#34D399" stroke-width="2" transform="rotate(90 32 32)"/>
  <!-- Orbiting electrons -->
  <circle cx="50" cy="22" r="3" fill="#A78BFA"/>
  <circle cx="14" cy="22" r="3" fill="#38BDF8"/>
  <circle cx="32" cy="58" r="3" fill="#34D399"/>
</svg>

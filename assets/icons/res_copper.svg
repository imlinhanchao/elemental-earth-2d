<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cu_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="cu_front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>
  <!-- Ingot top -->
  <polygon points="18,18 46,18 54,30 10,30" fill="url(#cu_top)" stroke="#7C2D12" stroke-width="2" stroke-linejoin="round"/>
  <!-- Ingot front -->
  <polygon points="10,30 54,30 48,48 16,48" fill="url(#cu_front)" stroke="#7C2D12" stroke-width="2" stroke-linejoin="round"/>
  <!-- Hallmark Cu -->
  <text x="32" y="27" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#7C2D12" text-anchor="middle">Cu 29</text>
  <!-- Highlight chamfer line -->
  <line x1="10" y1="30" x2="54" y2="30" stroke="#FFEDD5" stroke-width="1.5"/>
</svg>

  <path d="M32 10 C32 10, 48 28, 48 40 C48 49, 41 56, 32 56 C23 56, 16 49, 16 40 C16 28, 32 10, 32 10 Z" 
        fill="url(#resin_highlight)"/>
  <!-- Specular glint -->
  <ellipse cx="26" cy="34" rx="4" ry="7" transform="rotate(-25 26 34)" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="36" cy="45" r="2.5" fill="#FEF3C7" opacity="0.6"/>
</svg>

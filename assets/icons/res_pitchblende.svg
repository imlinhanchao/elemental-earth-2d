<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="radGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="30,10 50,22 48,50 18,52 12,24" fill="url(#pitGrad)" stroke="#22C55E" stroke-width="1.8"/>
  <!-- 铀辐射荧光裂隙 -->
  <path d="M28,14 Q32,28 24,36 T36,48" stroke="#4ADE80" stroke-width="2.5" fill="none" filter="url(#radGlow)"/>
  <circle cx="32" cy="30" r="3" fill="#86EFAC" filter="url(#radGlow)"/>
  <circle cx="24" cy="42" r="2" fill="#4ADE80"/>
</svg>
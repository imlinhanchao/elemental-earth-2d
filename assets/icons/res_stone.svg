<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="st_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="st_mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="st_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Main faceted boulder -->
  <polygon points="32,8 52,22 48,50 18,54 10,32" fill="url(#st_mid)" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Top facet -->
  <polygon points="32,8 52,22 34,28 18,18" fill="url(#st_top)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Center light facet -->
  <polygon points="18,18 34,28 32,46 16,38" fill="url(#st_mid)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right shadow facet -->
  <polygon points="34,28 52,22 48,50 32,46" fill="url(#st_dark)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bottom shadow facet -->
  <polygon points="16,38 32,46 48,50 18,54" fill="url(#st_dark)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Glint line -->
  <line x1="32" y1="8" x2="34" y2="28" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
</svg>

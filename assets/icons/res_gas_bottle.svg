<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tank_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <!-- Valve cap & stem -->
  <rect x="29" y="8" width="6" height="6" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="32" cy="6" r="3" fill="#94A3B8" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Cylinder rounded dome -->
  <path d="M22 22 C22 14 42 14 42 22 L42 50 C42 54 22 54 22 50 Z" fill="url(#tank_body)" stroke="#064E3B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Pressure gauge -->
  <circle cx="38" cy="11" r="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="1"/>
  <line x1="38" y1="11" x2="39" y2="10" stroke="#DC2626" stroke-width="1"/>
  <!-- Gas label band -->
  <rect x="23" y="30" width="18" height="6" fill="#064E3B"/>
  <text x="32" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="5" fill="#34D399" text-anchor="middle">GAS</text>
</svg>

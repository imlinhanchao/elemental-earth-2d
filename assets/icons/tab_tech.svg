<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- 背景科技光轮 -->
  <circle cx="32" cy="32" r="26" fill="#131B2E" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- 科技核心原子轨道环 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" transform="rotate(30 32 32)"/>
  <!-- 科技核心原子轨道环 2 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" transform="rotate(-30 32 32)"/>
  <!-- 科技核心原子轨道环 3 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" transform="rotate(90 32 32)"/>
  <!-- 中心核体能量球 -->
  <circle cx="32" cy="32" r="8" fill="url(#techGrad)" stroke="#DBEAFE" stroke-width="2"/>
  <circle cx="30" cy="30" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <!-- 绕行电子粒子 -->
  <circle cx="48" cy="23" r="2.5" fill="#60A5FA"/>
  <circle cx="16" cy="41" r="2.5" fill="#93C5FD"/>
  <circle cx="32" cy="10" r="2.5" fill="#38BDF8"/>
</svg>
